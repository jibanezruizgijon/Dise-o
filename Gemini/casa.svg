<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="600" height="600" style="background-color: #e0f7fa;">
  <defs>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d84315;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bf360c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5d4037;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3e2723;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8d6e63;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6d4c41;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8d6e63;stop-opacity:1" />
    </linearGradient>

    <filter id="shadowBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="4" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge> 
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/> 
      </feMerge>
    </filter>
  </defs>

  <style>
    /* --- Configuración Maestra de Animación --- */
    /* Todos los elementos construibles comienzan invisibles */
    .build-part {
        opacity: 0;
        /* La magia: el retraso se calcula basado en el orden del elemento */
        animation-delay: calc(var(--order) * 60ms);
        animation-fill-mode: forwards; /* Se quedan en su sitio al final */
        animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1); /* Efecto rebote */
    }

    /* --- Tipos de Animaciones --- */
    
    /* Ladrillos cayendo y rebotando */
    .anim-drop {
        transform-origin: center bottom;
        animation-name: dropIn;
        animation-duration: 0.6s;
    }
    
    @keyframes dropIn {
        from { opacity: 0; transform: translateY(-200px) scale(0.5); }
        to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Tejas deslizándose */
    .anim-slide {
        animation-name: slidePlace;
        animation-duration: 0.5s;
        animation-timing-function: ease-out;
    }
     @keyframes slidePlace {
        from { opacity: 0; transform: translate(-50px, -50px); }
        to   { opacity: 1; transform: translate(0, 0); }
    }

    /* Elementos creciendo (ventanas, puerta) */
    .anim-grow {
        transform-origin: center;
        animation-name: growUp;
        animation-duration: 0.7s;
    }
    @keyframes growUp {
        from { opacity: 0; transform: scale(0); }
        to   { opacity: 1; transform: scale(1); }
    }

    /* Mortero apareciendo (fade simple) */
    .anim-fade {
        animation-name: fadeIn;
        animation-duration: 1s;
        animation-timing-function: linear;
    }
    @keyframes fadeIn {
        from { opacity: 0; }
        to   { opacity: 1; }
    }
  </style>

  <ellipse cx="200" cy="330" rx="150" ry="20" fill="#a5d6a7" filter="url(#shadowBlur)" />

  <g transform="translate(100, 100)">
    
    <rect class="build-part anim-fade" style="--order: 1;" x="10" y="195" width="180" height="10" fill="#bdbdbd"/>

    <g id="brick-walls" fill="url(#brickGrad)" stroke="#8d6e63" stroke-width="0.5">
      <rect class="build-part anim-drop" style="--order: 5;" x="10" y="180" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 6;" x="40" y="180" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 7;" x="70" y="180" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 8;" x="100" y="180" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 9;" x="130" y="180" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 10;" x="160" y="180" width="28" height="15"/>
      
      <rect class="build-part anim-drop" style="--order: 12;" x="10" y="163" width="13" height="15"/>
      <rect class="build-part anim-drop" style="--order: 13;" x="25" y="163" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 14;" x="55" y="163" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 16;" x="115" y="163" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 17;" x="145" y="163" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 18;" x="175" y="163" width="15" height="15"/>

       <rect class="build-part anim-drop" style="--order: 20;" x="10" y="146" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 21;" x="40" y="146" width="28" height="15"/>
       <rect class="build-part anim-drop" style="--order: 23;" x="130" y="146" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 24;" x="160" y="146" width="28" height="15"/>

       <rect class="build-part anim-drop" style="--order: 26;" x="10" y="129" width="13" height="15"/>
      <rect class="build-part anim-drop" style="--order: 28;" x="65" y="129" width="18" height="15"/>
      <rect class="build-part anim-drop" style="--order: 30;" x="115" y="129" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 31;" x="145" y="129" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 32;" x="175" y="129" width="15" height="15"/>

      <rect class="build-part anim-drop" style="--order: 35;" x="10" y="112" width="28" height="15"/>
      <rect class="build-part anim-drop" style="--order: 37;" x="65" y="112" width="18" height="15"/>
      <rect class="build-part anim-drop" style="--order: 39;" x="85" y="112" width="75" height="15"/>
      <rect class="build-part anim-drop" style="--order: 40;" x="162" y="112" width="28" height="15"/>
      
      <rect class="build-part anim-drop" style="--order: 45;" x="10" y="95" width="180" height="17"/>
    </g> <g id="door-complex" transform="translate(85, 127)">
      <rect class="build-part anim-grow" style="--order: 50;" x="0" y="0" width="30" height="53" fill="#4e342e"/> <rect class="build-part anim-slide" style="--order: 52;" x="2" y="2" width="8" height="49" fill="url(#woodGrad)" stroke="#3e2723"/>
      <rect class="build-part anim-slide" style="--order: 53;" x="11" y="2" width="8" height="49" fill="url(#woodGrad)" stroke="#3e2723"/>
      <rect class="build-part anim-slide" style="--order: 54;" x="20" y="2" width="8" height="49" fill="url(#woodGrad)" stroke="#3e2723"/>
      <circle class="build-part anim-grow" style="--order: 56;" cx="24" cy="25" r="2" fill="#ffd54f"/> </g>

    <g id="window-complex" transform="translate(25, 112)">
       <rect class="build-part anim-grow" style="--order: 60;" x="0" y="0" width="40" height="35" fill="#5d4037"/> <rect class="build-part anim-grow" style="--order: 62;" x="3" y="3" width="16" height="13" fill="#90caf9"/> <rect class="build-part anim-grow" style="--order: 63;" x="21" y="3" width="16" height="13" fill="#90caf9"/> <rect class="build-part anim-grow" style="--order: 64;" x="3" y="18" width="16" height="13" fill="#90caf9"/> <rect class="build-part anim-grow" style="--order: 65;" x="21" y="18" width="16" height="13" fill="#90caf9"/> <rect class="build-part anim-fade" style="--order: 68;" x="0" y="35" width="44" height="5" rx="2" fill="#8d6e63"/> </g>

    <g id="roof-tiles" fill="url(#roofGrad)" stroke="#3e2723" stroke-width="0.5">
      <polygon class="build-part anim-fade" style="--order: 75;" points="0,95 200,95 100,20" fill="#3e2723"/>
       
       <path class="build-part anim-slide" style="--order: 80;" d="M0 95 L20 80 L40 95 Z" />
       <path class="build-part anim-slide" style="--order: 81;" d="M20 95 L40 80 L60 95 Z" />
       <path class="build-part anim-slide" style="--order: 82;" d="M40 95 L60 80 L80 95 Z" />
       <path class="build-part anim-slide" style="--order: 83;" d="M60 95 L80 80 L100 95 Z" />
       <path class="build-part anim-slide" style="--order: 84;" d="M180 95 L160 80 L140 95 Z" />
       <path class="build-part anim-slide" style="--order: 85;" d="M160 95 L140 80 L120 95 Z" />
       <path class="build-part anim-slide" style="--order: 86;" d="M140 95 L120 80 L100 95 Z" />

       <path class="build-part anim-slide" style="--order: 90;" d="M20 80 L40 65 L60 80 Z" />
       <path class="build-part anim-slide" style="--order: 91;" d="M40 80 L60 65 L80 80 Z" />
       <path class="build-part anim-slide" style="--order: 92;" d="M60 80 L80 65 L100 80 Z" />
       <path class="build-part anim-slide" style="--order: 93;" d="M160 80 L140 65 L120 80 Z" />
       <path class="build-part anim-slide" style="--order: 94;" d="M140 80 L120 65 L100 80 Z" />
       
       <path class="build-part anim-slide" style="--order: 100;" d="M50 55 L80 35 L110 55 Z" />
       <path class="build-part anim-slide" style="--order: 101;" d="M150 55 L120 35 L90 55 Z" />
       <rect class="build-part anim-grow" style="--order: 110;" x="90" y="15" width="20" height="10" rx="5" fill="#5d4037"/>
    </g>

    <g id="chimney" transform="translate(130, 30)">
       <rect class="build-part anim-drop" style="--order: 120;" x="0" y="20" width="25" height="20" fill="url(#brickGrad)" stroke="#8d6e63"/>
       <rect class="build-part anim-drop" style="--order: 122;" x="0" y="0" width="25" height="20" fill="url(#brickGrad)" stroke="#8d6e63"/>
       <rect class="build-part anim-grow" style="--order: 125;" x="-5" y="-5" width="35" height="8" fill="#5d4037"/> <circle cx="12" cy="-15" r="5" fill="#cfd8dc" opacity="0.7">
         <animate attributeName="cy" from="-15" to="-40" duration="3s" repeatCount="indefinite" />
         <animate attributeName="opacity" from="0.7" to="0" duration="3s" repeatCount="indefinite" />
          <animate attributeName="r" from="5" to="10" duration="3s" repeatCount="indefinite" />
       </circle>
    </g>
  </g>
</svg>