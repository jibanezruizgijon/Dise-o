    <path class="horse-frame" style="--i:7;" d="M 90,33 C 96,29 108,32 111,37 C 113,41 111,46 107,48 C 104,50 99,46 99,46 L 95,53 C 100,60 102,71 95,75 L 108,88 L 115,98 M 95,75 L 118,85 L 130,92 M 40,55 C 36,52 25,50 23,62 C 22,69 28,75 36,73 C 44,71 40,55 40,55 L 46,46 C 50,40 66,40 76,41 L 90,33 L 83,59 L 58,59 C 48,59 48,69 43,74 L 50,75 L 65,75 M 43,74 L 55,78 L 72,80" />
  </g>

  <ellipse cx="280" cy="230" rx="80" ry="10" fill="#388E3C" opacity="0.5" />

</svg>