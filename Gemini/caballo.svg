<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="800" height="400" style="background-color: #87CEEB;">
  <defs>
    <pattern id="grassPattern" x="0" y="0" width="200" height="100" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="200" height="100" fill="#4CAF50" />
      <path d="M10,80 L15,60 L20,80 M50,90 L55,70 L60,90 M120,85 L125,65 L130,85 M170,80 L175,60 L180,80" stroke="#388E3C" stroke-width="2" fill="none"/>
      <circle cx="30" cy="90" r="2" fill="#5D4037" opacity="0.5"/>
      <circle cx="150" cy="85" r="3" fill="#5D4037" opacity="0.5"/>
    </pattern>
  </defs>

  <style>
    /* --- Configuración del Galope --- */
    :root {
      /* Velocidad del ciclo completo del galope. 
         Más bajo = más rápido. 0.5s a 0.6s es realista para un galope rápido */
      --gallop-speed: 0.55s; 
      /* Número total de dibujos (frames) que tenemos */
      --total-frames: 8;
    }

    /* Animación del suelo (scrolling infinito) */
    .ground-mover {
      animation: scrollGround 1.5s linear infinite;
    }
    @keyframes scrollGround {
      from { transform: translateX(0); }
      to { transform: translateX(-200px); } /* Mueve el ancho exacto del patrón */
    }

    /* --- Motor de Animación del Caballo --- */
    .horse-frame {
      /* Por defecto, todos los frames están ocultos */
      opacity: 0;
      fill: #5D4037; /* Color del caballo (marrón) */
      stroke: #3E2723;
      stroke-width: 1;
      
      /* La animación 'showFrame' se aplica a todos.
         steps(1) es crucial: hace que el cambio sea instantáneo, sin transición suave */
      animation: showFrame var(--gallop-speed) steps(1) infinite;
      
      /* Calculamos el retraso basado en el índice del frame (--i) */
      animation-delay: calc( (var(--gallop-speed) / var(--total-frames)) * var(--i) );
    }

    /* La keyframe clave: solo hace visible el elemento brevemente al inicio de su turno */
    @keyframes showFrame {
      0% { opacity: 1; }
      /* Justo después de empezar, se vuelve a ocultar para dejar paso al siguiente frame.
         El valor 12.5% es (100% / 8 frames) */
      12.5% { opacity: 0; } 
      100% { opacity: 0; }
    }
  </style>

  <rect class="ground-mover" x="0" y="200" width="800" height="100" fill="url(#grassPattern)" />

  <g transform="translate(200, 120) scale(1.5)">
      
    <path class="horse-frame" style="--i:0;" d="M 92,34 C 98,30 110,33 113,38 C 115,42 113,47 109,49 C 106,51 101,47 101,47 L 97,54 C 102,61 104,72 97,76 L 115,90 L 118,103 M 97,76 L 122,85 L 135,89 M 42,56 C 38,53 27,51 25,63 C 24,70 30,76 38,74 C 46,72 42,56 42,56 L 48,47 C 52,41 68,41 78,42 L 92,34 L 85,60 L 60,60 C 50,60 50,70 45,75 L 25,88 L 10,83 M 45,75 L 20,95 L 0,95" />

    <path class="horse-frame" style="--i:1;" d="M 85,35 C 91,31 103,34 106,39 C 108,43 106,48 102,50 C 99,52 94,48 94,48 L 90,55 C 95,62 97,73 90,77 L 100,98 L 98,115 M 90,77 L 108,95 L 115,108 M 35,57 C 31,54 20,52 18,64 C 17,71 23,77 31,75 C 39,73 35,57 35,57 L 41,48 C 45,42 61,42 71,43 L 85,35 L 78,61 L 53,61 C 43,61 43,71 38,76 L 25,90 L 15,88 M 38,76 L 22,98 L 12,100"/>

    <path class="horse-frame" style="--i:2;" d="M 80,37 C 86,33 98,36 101,41 C 103,45 101,50 97,52 C 94,54 89,50 89,50 L 85,57 C 90,64 92,75 85,79 L 88,102 L 82,118 M 85,79 L 96,100 L 98,115 M 30,59 C 26,56 15,54 13,66 C 12,73 18,79 26,77 C 34,75 30,59 30,59 L 36,50 C 40,44 56,44 66,45 L 80,37 L 73,63 L 48,63 C 38,63 38,73 33,78 L 28,95 L 25,105 M 33,78 L 35,100 L 38,110" />

    <path class="horse-frame" style="--i:3;" d="M 78,40 C 84,36 96,39 99,44 C 101,48 99,53 95,55 C 92,57 87,53 87,53 L 83,60 C 88,67 90,78 83,82 L 80,105 L 72,118 M 83,82 L 88,102 L 82,115 M 28,62 C 24,59 13,57 11,69 C 10,76 16,82 24,80 C 32,78 28,62 28,62 L 34,53 C 38,47 54,47 64,48 L 78,40 L 71,66 L 46,66 C 36,66 36,76 31,81 L 35,90 L 45,95 M 31,81 L 40,95 L 55,98" />

    <path class="horse-frame" style="--i:4;" d="M 78,42 C 84,38 96,41 99,46 C 101,50 99,55 95,57 C 92,59 87,55 87,55 L 83,62 C 88,69 90,80 83,84 L 75,102 L 65,110 M 83,84 L 82,100 L 75,112 M 28,64 C 24,61 13,59 11,71 C 10,78 16,84 24,82 C 32,80 28,64 28,64 L 34,55 C 38,49 54,49 64,50 L 78,42 L 71,68 L 46,68 C 36,68 36,78 31,83 L 45,85 L 60,88 M 31,83 L 50,82 L 70,85" />

    <path class="horse-frame" style="--i:5;" d="M 80,40 C 86,36 98,39 101,44 C 103,48 101,53 97,55 C 94,57 89,53 89,53 L 85,60 C 90,67 92,78 85,82 L 85,98 L 80,110 M 85,82 L 92,95 L 90,108 M 30,62 C 26,59 15,57 13,69 C 12,76 18,82 26,80 C 34,78 30,62 30,62 L 36,53 C 40,47 56,47 66,48 L 80,40 L 73,66 L 48,66 C 38,66 38,76 33,81 L 55,80 L 75,78 M 33,81 L 60,75 L 85,70" />

