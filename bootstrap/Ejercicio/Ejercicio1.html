<!doctype html>
<html lang="en">

<head>
    <title>Bootstrap</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
</head>

<body>

    <!-- Diseño con todo dentro de un contenedor -->
    <div class="container">
        <!-- HEADER -->
        <header class="row justify-content-center m-3">
            <div class="col-4 col-md-3 col-lg-2">
                <img src="img/cars_logo.png" class="img-fluid" alt="logo de cars">
            </div>
            <div class="row">
                <!-- BARRA DE NAVEGACIÓN  -->
                <div class="col">
                    <nav class="navbar navbar-expand-lg bg-danger" data-bs-theme="dark">
                        <div class="container-fluid">
                            <a class="navbar-brand" href="#">Inicio</a>
                            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                                data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup"
                                aria-expanded="false" aria-label="Toggle navigation">
                                <span class="navbar-toggler-icon"></span>
                            </button>
                            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                                <div class="navbar-nav">
                                    <a class="nav-link active" aria-current="page" href="#">Inicio</a>
                                    <a class="nav-link" href="#">Coches</a>
                                    <a class="nav-link" href="#">Blog</a>
                                    <a class="nav-link">Tienda</a>
                                </div>
                            </div>
                        </div>
                    </nav>
                </div>
            </div>
        </header>

        <!-- MENÚ -->

        <!-- MULTIMEDIA -->
        <section class="row mt-3">
            <!-- Columna 1 (video) -->
            <div class="col-md-6">
                <div class="ratio ratio-4x3">
                    <iframe width="560" height="315" src="https://www.youtube.com/embed/UXxtA7eI1Lw?si=sb0qxARuU1xuecrV"
                        title="YouTube video player" frameborder="0"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
                </div>
            </div>
            <!-- Columna 2 (fotos) -->
            <div class="col-md-6">
                <!-- Fila 1 Columna 2 -->
                <div class="row mt-3 mt-md-0">
                    <!-- Foto 1 -->
                    <div class="col-sm-6">
                        <figure class="figure">
                            <img src="img/img1.jpg" class="img-fluid figure-img rounded" alt="mini cooper rojo 1965">
                            <figcaption class="figure-caption text-center">Mini Cooper 1965</figcaption>
                        </figure>
                    </div>
                    <!-- Foto 2 -->
                    <div class="col-sm-6">
                        <figure class="figure">
                            <img src="img/img2.jpg" class="img-fluid figure-img rounded" alt="peugeot 403 1970 azul">
                            <figcaption class="figure-caption text-center">Peugeot 403 1970</figcaption>
                        </figure>
                    </div>
                </div>
                <!-- Fila 2 Columna 2 -->
                <div class="row">
                    <!-- Foto 3 -->
                    <div class="col-sm-6">
                        <figure class="figure">
                            <img src="img/img3.jpg" class="img-fluid figure-img rounded" alt=" Moto Vespa ">
                            <figcaption class="figure-caption text-center">Moto Vespa</figcaption>
                        </figure>
                    </div>
                    <!-- Foto 4 -->
                    <div class="col-sm-6">
                        <figure class="figure">
                            <img src="img/img4.jpg" class="img-fluid figure-img rounded" alt="Moto bmw">
                            <figcaption class="figure-caption text-center">Moto BMW</figcaption>
                        </figure>
                    </div>
                </div>
            </div>
        </section>
        <!-- ANUNCIOS -->
        <section></section>
        <!-- CONTACTO -->
        <section></section>
        <!-- FOOTER -->
        <footer>

        </footer>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"
        integrity="sha384-BBtl+eGJRgqQAUMxJ7pMwbEyER4l1g+O15P+16Ep7Q9Q+zqX6gSbd85u4mG4QzX+"
        crossorigin="anonymous"></script>
</body>

</html>
