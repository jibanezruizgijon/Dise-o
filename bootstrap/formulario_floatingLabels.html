<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form</title>
    <link rel="stylesheet" href="css/bootstrap.css">
    <!-- <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"> -->

    <!-- CDN ICONOS BOOTSRATP -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <section class="container-md">
        <div class="row mt-3 justify-content-center">
            <div class="col-md-6">
                <h1>Formulario de Acceso</h1>
                <!-- Formulario -->
                 <!-- Versión floating labels -->
                <form action="#" class="p-4 bg-primary-subtle border rounded needs-validation" novalidate>
                    <legend> <i class="bi bi-people me-3"></i>Acceso usuario</legend>
                    <!-- Email -->
                    <div class="mb-3 form-floating position-relative">
                        <input type="email" name="email" id="input-email" class="form-control form-select-lg" placeholder="" required />
                        <label for="input-email" class="form-label" class="form-label">Correo electrónico</label>
                        <div id="email-help-block" class="form-text">
                            No compartiremos tu dirección de email con nadie más.
                        </div>
                        <div class="valid-feedback">Campo válido</div>
                        <div class="invalid-feedback">Debes Completar el correo Electrónico</div>
                    </div>
                    <!-- Contraseña -->
                    <div class="mb-3 form-floating position-relative">
                        <input type="password" name="password" id="input-password" class="form-control form-select-lg" placeholder="" required />
                        <label for="input-password" class="form-label">Contraseña</label>
                        <div id="password-help-block" class="form-text">
                            Tu contraseña debe tener entre 8 y 20 caracteres, contener
                            letras y números,...
                        </div>
                        <div class="valid-feedback">Campo válido</div>
                        <div class="invalid-feedback">Debes Completar el correo Electrónico</div>
                    </div>
                    <!-- Select perfil -->
                    <div class="mb-3">
                        <label for="select-profile" class="form-label">Perfil</label>
                        <select name="role" id="select-profile" class="form-select">
                            <option selected disabled>Seleccione perfil</option>
                            <option value="admin">Administrador/a</option>
                            <option value="client">Cliente</option>
                            <option value="guest">Invitado</option>
                        </select>
                    </div>

                    <!-- Checkbox recuérdame -->
                    <div class="form-check form-switch mb-3">
                        <label for="check-remember" class="form-check-label">Recuérdame</label>
                        <input type="checkbox" name="remember" id="check-remember" class="form-check-input" />
                    </div>

                    <div>
                        <button type="submit" class="btn bg-primary text-light w-100">Entrar</button>
                    </div>

                </form>
            </div>
        </div>
    </section>
    <script src="js/validation.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
</body>

</html>
