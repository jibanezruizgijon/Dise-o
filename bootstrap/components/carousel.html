<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel</title>
    <link rel="stylesheet" href="../css/bootstrap.css">
    <!-- CDN ICONOS BOOTSRATP -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>
    <section class="container-xl">
        <!-- CABECERA -->
        <div class="row text-center mt-3">
            <div class="col">
                <h1>Ejemplo de componente Bootstrap: Carrusel</h1>
            </div>
        </div>

        <div class="row ">
            <div class="col">
                <!-- INICIO carrusel -->
                <div id="myCarrusel" class="carousel slide" data-bs-ride="carousel">
                    <!-- CONTENIDO del carrusel -->
                    <div class="carousel-inner">
                        <div class="carousel-item active" data-bs-interval="3000">
                            <img src="img/coche.jpg" class="d-block w-100" alt="coche lujoso">
                            <div class="carousel-caption d-none d-md-block">
                                <h5 class="text-light display-2">ROLLS ROYCE</h5>
                                <p>Coche lujoso</p>
                            </div>
                        </div>



                        <div class="carousel-item" data-bs-interval="3000">
                            <img src="img/coche2.jpg" class="d-block w-100" alt="coche lujoso">
                            <div class="carousel-caption d-none d-md-block">
                                <h5 class="text-light display-2">ESCARABAJO</h5>
                                <p>Coche antiguo</p>
                            </div>
                        </div>


                        <div class="carousel-item" data-bs-interval="3000">
                            <img src="img/coche3.jpg" class="d-block w-100" alt="coche lujoso">
                            <div class="carousel-caption d-none d-md-block">
                                <h5 class="text-light display-2">AUDI</h5>
                                <p>Coche deportivo</p>
                            </div>
                        </div>
                    </div>

                    <!-- BOTONES de NEXT y PREVS -->
                    <button type="button" class="carousel-control-prev" data-bs-target="#myCarrusel"
                        data-bs-slide="prev">
                        <span class="carousel-control-prev-icon"></span>
                    </button>

                    <button type="button" class="carousel-control-next" data-bs-target="#myCarrusel"
                        data-bs-slide="next">
                        <span class="carousel-control-next-icon"></span>
                    </button>

                    <!-- INDICADORES -->
                    <div class="carousel-indicators">
                        <button type="button" data-bs-target="#myCarrusel" data-bs-slide-to="0" class="active"></button>
                        <button type="button" data-bs-target="#myCarrusel" data-bs-slide-to="1"></button>
                        <button type="button" data-bs-target="#myCarrusel" data-bs-slide-to="2"></button>
                    </div>
                </div>
                <!-- FIN de carrusel -->
            </div>
        </div>


    </section>
    <script src="../js/bootstrap.bundle.min.js"></script>
</body>

</html>
