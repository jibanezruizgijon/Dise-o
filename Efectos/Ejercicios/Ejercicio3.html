<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>transition-timing-function</title>
    <link rel="stylesheet" href="Ejercicio3.css">
</head>

<body>
    <section class="container">
        <article class="transition">
            <h3 class="transition__titulo">Ease(Default)</h3>
            <img  class="transition__img default" src="img/baloncesto.png" alt="Pelota">
        </article>
        <article class="transition">
            <h3 class="transition__titulo">Ease-In</h3>
            <img  class="transition__img in" src="img/baloncesto.png" alt="Pelota">
        </article>
        <article class="transition">
            <h3 class="transition__titulo">Ease-Out</h3>
            <img  class="transition__img out" src="img/baloncesto.png" alt="Pelota">
        </article>
        <article class="transition">
            <h3 class="transition__titulo">Ease-In-Out</h3>
            <img  class="transition__img inOut" src="img/baloncesto.png" alt="Pelota">
        </article>
        <article class="transition">
            <h3 class="transition__titulo">Linear</h3>
            <img  class="transition__img linear" src="img/baloncesto.png" alt="Pelota">
        </article>
    </section>
</body>

</html>
