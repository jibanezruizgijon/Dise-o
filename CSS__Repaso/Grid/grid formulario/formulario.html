<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="formulario.css">
</head>

<body>
    <div class="container">
        <figure class="container__bloque"><img src="illustration.svg" alt="" class="container__img"></figure>
        <section>
            <form action="" class="formulario">
                <h1><span>We</span> keep in touch</h1>
                
                <input type="text" placeholder="Your name" class="formulario__name">
                <input type="text" placeholder="Your e-mail" class="formulario__email">
                <textarea name="" placeholder="Message..." class="formulario__area"></textarea>
                <input type="submit" value="Send now" class="formulario__boton">
            </form>
        </section>
    </div>
</body>

</html>
